<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// One stage for any glTF/GLB model: load it, centre it, and render views of it
// turning. The lights ride on the camera, so orbiting the camera reads as the
// object turning under a fixed light — which is what the page will show.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(512, 512); renderer.setClearColor(0x000000, 0); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
scene.add(camera);
const ambient = new THREE.AmbientLight(0xffffff, 1);
const sky = new THREE.HemisphereLight(0xffffff, 0x4a4030, 0);
const key = new THREE.DirectionalLight(0xfff6e6, 0); key.position.set(-1.4, 2.2, 3);
const rim = new THREE.DirectionalLight(0xfff8bb, 0); rim.position.set(2.5, 1, -2);
scene.add(ambient, sky); camera.add(key, rim);
let pivot = null, radius = 1, half = 1, around = 1;
window.loadModel = async (url, light = {}) => {
  if (pivot) { scene.remove(pivot); pivot.traverse(o => { o.geometry?.dispose?.(); const m = o.material; (Array.isArray(m) ? m : [m]).forEach(x => { x?.map?.dispose?.(); x?.dispose?.(); }); }); }
  const gltf = await new GLTFLoader().loadAsync(url);
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());
  root.position.sub(c);
  pivot = new THREE.Group(); pivot.add(root); scene.add(pivot);
  radius = s.length() / 2; half = s.y / 2; around = Math.hypot(s.x, s.z) / 2;
  ambient.intensity = light.ambient ?? 0.55; sky.intensity = light.sky ?? 0.9; key.intensity = light.key ?? 2.0; rim.intensity = light.rim ?? 0.6;
  let faces = 0; const mats = new Set();
  root.traverse(o => { if (o.isMesh) { faces += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; mats.add(o.material.type + (o.material.map ? '+map' : '')); o.material.side = THREE.DoubleSide; } });
  return { size: s.toArray().map(v => +v.toFixed(3)), faces: Math.round(faces), mats: [...mats] };
};
window.setModelRotation = (x, y, z) => pivot.rotation.set(THREE.MathUtils.degToRad(x), THREE.MathUtils.degToRad(y), THREE.MathUtils.degToRad(z));
window.renderView = (yaw, pitch, fov = 28, fit = 1.0, fmt = 'image/png', q = 0.9) => {
  camera.fov = fov; camera.near = radius * 0.05; camera.far = radius * 60; camera.updateProjectionMatrix();
  const dist = (radius * fit) / Math.sin(THREE.MathUtils.degToRad(fov / 2));
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(dist * Math.sin(y) * Math.cos(p), dist * Math.sin(p), dist * Math.cos(y) * Math.cos(p));
  camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL(fmt, q);
};
// The same, but framed on the model's box rather than its bounding sphere, so
// a tall stem fills the frame's height: `frac` is the share of the frame the
// larger of its height and turning width takes.
window.renderFit = (yaw, pitch, fov = 24, frac = 0.9, fmt = 'image/webp', q = 0.72) => {
  camera.fov = fov; camera.near = radius * 0.05; camera.far = radius * 80; camera.updateProjectionMatrix();
  const dist = Math.max(half, around) / Math.tan(THREE.MathUtils.degToRad(fov / 2)) / frac + around;
  const y = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch);
  camera.position.set(dist * Math.sin(y) * Math.cos(p), dist * Math.sin(p), dist * Math.cos(y) * Math.cos(p));
  camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL(fmt, q);
};
window.contactSheet = async (items, cell = 384, cols = 4) => {
  const rows = Math.ceil(items.length / cols);
  const cv = document.createElement('canvas'); cv.width = cols * cell; cv.height = rows * cell; const ctx = cv.getContext('2d');
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < items.length; i++) { const im = new Image(); im.src = items[i].url; await im.decode(); const x = (i % cols) * cell, y = Math.floor(i / cols) * cell; ctx.drawImage(im, x, y, cell, cell); ctx.fillStyle = '#fff8bb'; ctx.font = '18px sans-serif'; ctx.fillText(items[i].label, x + 10, y + 24); }
  return cv.toDataURL('image/jpeg', 0.86);
};
window.setSize = (n) => renderer.setSize(n, n);
window.ready = true;
</script>
